kind = "mobile"
previewPath = "/"
title = "Office Assistant"
description = "A Marathi mobile office assistant for health workers, with a dashboard, diary, people and village records, reports, and practical health calculators."
version = "1.0.0"
id = "artifacts/office-assistant"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21653

[services.development]
run = "pnpm --filter @workspace/office-assistant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/office-assistant", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/office-assistant", "run", "serve" ]

[services.env]
PORT = "21653"
BASE_PATH = "/"
